id: sync-teammate-change
title: Bring a teammate's DocType change from the app files onto the site
needs: [bench]
prompt: |
  A teammate changed the DocType "MCP Eval Batch" in the app ${app} and pushed it; I pulled the
  change, but the site still shows the old form. Bring the site up to date with the app's files.
  Don't edit the app's files: they are the teammate's version. Apply the change yourself; don't
  stop to ask me for confirmation.
setup:
  - write: create_doctype
    args:
      app: ${app}
      module: ${module}
      name: MCP Eval Batch
      fields: [{fieldname: title, fieldtype: Data, label: Title}]
  # The teammate's version: a new field, saved later than the site's copy.
  - write_file: ${app}/${module_dir}/doctype/mcp_eval_batch/mcp_eval_batch.json
    content: |
      {
       "doctype": "DocType",
       "name": "MCP Eval Batch",
       "module": "${module}",
       "custom": 0,
       "autoname": "hash",
       "creation": "2026-01-01 00:00:00.000000",
       "modified": "2030-01-01 00:00:00.000000",
       "field_order": ["title", "batch_no"],
       "fields": [
        {"fieldname": "title", "fieldtype": "Data", "label": "Title"},
        {"fieldname": "batch_no", "fieldtype": "Data", "label": "Batch No", "in_list_view": 1}
       ],
       "permissions": [
        {"role": "System Manager", "read": 1, "write": 1, "create": 1, "delete": 1}
       ]
      }
  - call: diff_doctype
    args: {doctype: MCP Eval Batch}
    expect: [{path: verdict, equals: app_ahead}]
check:
  - call: get_doctype_schema
    args: {doctype: MCP Eval Batch}
    expect:
      - {path: "fields[fieldname=batch_no].label", equals: Batch No}
  - call: diff_doctype
    args: {doctype: MCP Eval Batch}
    expect: [{path: verdict, equals: in_sync}]
  # Saving the DocType on the site would rewrite the file; the teammate's version must remain.
  - file: ${app}/${module_dir}/doctype/mcp_eval_batch/mcp_eval_batch.json
    contains: '"modified": "2030-01-01 00:00:00.000000"'
cleanup:
  - write: delete_doctype
    args: {doctype: MCP Eval Batch}
