[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-frappe"
version = "0.1.0"
description = "Universal MCP server app for Frappe Framework and installed apps"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.24,<5.0",
  "Click>=8.1.8,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mcp_frappe", "frappe_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
