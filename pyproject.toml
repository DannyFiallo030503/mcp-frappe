[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-frappe"
version = "0.2.0"
description = "Standalone MCP server for connecting to Frappe sites over HTTP"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1.0",
  "mcp>=1.26,<2.0",
  "pydantic>=2.11,<3.0",
]

[project.scripts]
mcp-frappe = "frappe_mcp.standalone:main"

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0", "ruff>=0.11,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["frappe_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
